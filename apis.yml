aid: culdesac
name: Culdesac
description: 'Culdesac is a post-car real estate development company building walkable,
  car-free neighborhoods in the United States. Its first project, Culdesac Tempe in
  Tempe, Arizona, broke ground in 2019 and welcomed its first residents in 2021 — a
  16-acre, roughly $140 million development of 636 apartment units plus 24,000 square
  feet of restaurant and retail space, designed with no resident parking. Residents
  receive transportation benefits such as free light-rail rides and discounted rideshare
  and scooter access in place of car ownership. Culdesac operates leasing, tours, and
  resident services through its website and HubSpot-backed portals, and intends to
  replicate the car-free neighborhood model in other cities. It was surfaced as a portfolio
  company of Initialized Capital and added to the API Evangelist network. Culdesac
  publishes no public developer API; this profile captures the company identity and
  domain-security posture.'
